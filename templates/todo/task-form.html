{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
      <a href="{% url 'todo:index' %}" class="btn btn-outline-secondary">Отмена</a>
      <button type="submit" class="btn btn-dark">Сохранить</button>
    </div>
</form>
{% endblock %}
